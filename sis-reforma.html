<title>SIS | Reforma Tributária</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" />

<!--
  SIS — hub de trabalho da Reforma Tributária (arquivo único), por perfil de empresa.
  Rotas por hash: #portal, #plano, #cst. Ordem do arquivo: style (shell + escopo por visão),
  nav, #view, blocos JSON (cst-data, perfis) e o script principal.
  PERFIL PRIVADO: o bloco JSON com data-perfil e id perfil-infios concentra a logo, o perfil da empresa,
  as frentes de trabalho e os códigos relevantes desse perfil. Apague esse bloco para obter uma versão genérica.
  FICHA SETORIAL: o bloco setores-data (12 setores) é gerado por script a partir das fichas dos perfis setoriais do hub do PÓS: python3 gerar-setores.py hub-pos-reforma.html --inserir sis-reforma.html. Nunca digitar à mão.
  DIAGNÓSTICO: o bloco checklist-data (sete blocos) é gerado por script: python3 gerar-checklist.py --inserir sis-reforma.html. Os itens são de redação própria. A classificação sugerida usa limites de trabalho (inferência de estudo).
  FLUXO DE CAIXA: rota #caixa, usa os valores da carga efetiva e os prazos do campo caixa do perfil.
  CALENDÁRIO DE PREÇO: rota #preco, usa os valores da carga efetiva (mesmas premissas).
  CARGA EFETIVA: simulador parametrizável (rota #carga). Os valores iniciais vêm do campo carga do perfil; os do perfil privado ficam no bloco dele.
  VERSÃO DA TABELA CST: os campos versao, publicacao e links do bloco cst-data alimentam o selo amarelo, a legenda e o rodapé da tela de consulta.
  Ao carregar uma planilha nova, atualize versao e publicacao (os textos usam os marcadores {versao} e {publicacao}).
  Tabela CST: gerada por script a partir do Informe Técnico oficial (nunca digitar à mão).
-->
<style>

:root{
  --charcoal:#324155; --yellow:#D0FF25; --platinum:#E7E7E7; --white:#FFFFFF;
  --slate:#58636E; --lav:#A9A0EB; --lav1:#8377D1; --lav2:#6656D0; --lav3:#5436CC;
  --nav-h:40px; --legend-h:34px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:var(--platinum);color:var(--charcoal);}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;font-size:20px;line-height:1;}
.topnav{background:var(--charcoal);border-bottom:1px solid rgba(255,255,255,0.1);position:sticky;top:0;z-index:40;height:var(--nav-h);}
.topnav .inner{max-width:1260px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:4px;height:100%;}
.topnav a{color:var(--platinum);text-decoration:none;font-size:12.5px;font-weight:700;padding:0 14px;height:100%;display:flex;align-items:center;border-bottom:3px solid transparent;}
.topnav a:hover{color:var(--white);}
.topnav a.active{color:var(--yellow);border-bottom-color:var(--yellow);}
.topnav .spacer{flex:1;}
.topnav .perfil{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--lav);font-weight:700;}
.topnav select{background:var(--charcoal);color:var(--platinum);border:1px solid rgba(255,255,255,0.3);border-radius:6px;font-size:12px;padding:3px 8px;font-family:inherit;}
.sis-brand{font-size:26px;font-weight:800;letter-spacing:-0.5px;color:var(--white);}
.sis-brand span{color:var(--yellow);}
[data-v="cst"] .src-badge a{color:var(--charcoal);text-decoration:underline;font-weight:800;}
.sis-brand small{font-size:12px;font-weight:600;color:var(--lav);margin-left:10px;letter-spacing:0;}

/* ===== Visão: Portal ===== */
[data-v="portal"] header{background:var(--charcoal);color:var(--white);padding:44px 32px 40px;border-bottom:4px solid var(--yellow);}
[data-v="portal"] .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;max-width:1100px;margin-left:auto;margin-right:auto;}
[data-v="portal"] .brand .logo{font-size:30px;font-weight:800;letter-spacing:-0.5px;color:var(--white);}
[data-v="portal"] .brand .logo span{color:var(--yellow);}
[data-v="portal"] .brand .tag{font-size:12px;color:var(--lav);font-weight:600;letter-spacing:0.3px;}
[data-v="portal"] header .inner{max-width:1100px;margin:0 auto;}
[data-v="portal"] header h1{margin:10px 0 8px;font-size:28px;font-weight:800;max-width:640px;line-height:1.25;}
[data-v="portal"] header p{margin:0;font-size:14px;color:var(--platinum);max-width:640px;line-height:1.6;}
[data-v="portal"] main{max-width:1100px;margin:0 auto;padding:36px 24px 60px;}
[data-v="portal"] .section-title{font-size:13px;text-transform:uppercase;letter-spacing:0.6px;color:var(--slate);font-weight:800;margin:0 0 14px;}
[data-v="portal"] .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:40px;}
[data-v="portal"] .card{background:var(--white);border-radius:12px;padding:22px;
    border-top:4px solid var(--lav2);
    box-shadow:0 1px 3px rgba(50,65,85,0.1);
    display:flex;flex-direction:column;gap:10px;
    text-decoration:none;color:inherit;
    transition:transform .15s ease, box-shadow .15s ease;}
[data-v="portal"] .card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(50,65,85,0.15);}
[data-v="portal"] .card .icon{width:38px;height:38px;border-radius:9px;background:var(--charcoal);color:var(--yellow);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;}
[data-v="portal"] .card h3{margin:2px 0 0;font-size:16px;font-weight:800;}
[data-v="portal"] .card p{margin:0;font-size:13px;color:var(--slate);line-height:1.5;flex:1;}
[data-v="portal"] .card .status{font-size:11px;font-weight:800;letter-spacing:0.3px;text-transform:uppercase;
    padding:4px 10px;border-radius:20px;width:fit-content;}
[data-v="portal"] .status.live{background:#e8ffcf;color:#4a6b0a;}
[data-v="portal"] .status.soon{background:var(--platinum);color:var(--slate);}
[data-v="portal"] .card.disabled{opacity:0.65;cursor:default;}
[data-v="portal"] .card.disabled:hover{transform:none;box-shadow:0 1px 3px rgba(50,65,85,0.1);}
[data-v="portal"] .roadmap{background:var(--white);border-radius:12px;padding:24px 26px;border:1px solid #d8d8d8;}
[data-v="portal"] .roadmap h3{margin:0 0 12px;font-size:15px;}
[data-v="portal"] .roadmap ol{margin:0;padding-left:20px;font-size:13.5px;line-height:1.9;color:var(--charcoal);}
[data-v="portal"] .roadmap li span{color:var(--slate);font-size:12.5px;}
[data-v="portal"] footer{max-width:1100px;margin:0 auto 40px;padding:0 24px;font-size:12px;color:var(--slate);line-height:1.6;}


/* ===== Visão: Plano de Ação ===== */

[data-v="plano"] .acc-header .titlewrap{flex:1;}
[data-v="plano"] .acc-header h3{margin:0;font-size:14.5px;font-weight:800;}

[data-v="plano"] .acc-header.open .chev{transform:rotate(90deg);}
[data-v="plano"] .status-tag{font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap;}

[data-v="plano"] .status-tag.wip{background:var(--yellow);color:var(--charcoal);}
[data-v="plano"] .status-tag.done{background:#7bc142;color:#1c3300;}
[data-v="plano"] .acc-body{background:var(--white);max-height:0;overflow:hidden;transition:max-height .3s ease;}
[data-v="plano"] .acc-body.expanded{max-height:2000px;}
[data-v="plano"] .acc-body-inner{padding:18px 22px 20px;}
[data-v="plano"] .acc-body-inner p{margin:0 0 12px;font-size:13.5px;line-height:1.6;color:var(--charcoal);}
[data-v="plano"] .acc-body-inner ul{margin:0 0 14px;padding-left:20px;font-size:13px;line-height:1.8;color:var(--slate);}
[data-v="plano"] .tool-link{display:inline-flex;align-items:center;gap:8px;background:var(--lav);color:var(--charcoal);font-weight:800;font-size:12.5px;padding:8px 14px;border-radius:8px;text-decoration:none;margin-top:4px;}
[data-v="plano"] .tool-link:hover{background:var(--lav1);color:var(--white);}
[data-v="plano"] footer{max-width:1180px;margin:0 auto 40px;padding:0 24px;font-size:12px;color:var(--slate);line-height:1.6;}
[data-v="plano"] footer .reminder{background:var(--white);border-left:4px solid var(--lav);padding:12px 16px;border-radius:6px;margin-top:10px;}

[data-v="cst"] .dot.on{background:var(--lav2);}

[data-v="cst"] .acc-body.expanded{max-height:none;overflow:visible;}
[data-v="cst"] table{width:100%;border-collapse:collapse;}
[data-v="cst"] thead th{position:sticky;top:calc(var(--nav-h) + var(--legend-h));z-index:25;
    background:var(--lav);color:var(--charcoal);font-size:9.5px;text-transform:uppercase;
    letter-spacing:.2px;font-weight:800;padding:7px 10px;text-align:left;white-space:nowrap;}
[data-v="cst"] td{padding:8px 10px;text-align:left;font-size:12.5px;border-bottom:1px solid var(--platinum);vertical-align:top;}
[data-v="cst"] td.code{font-family:'Consolas',monospace;font-weight:700;color:var(--lav3);white-space:nowrap;width:80px;}
[data-v="cst"] tr:hover td{background:#faf9ff;}
[data-v="cst"] tr.hl td{background:#fbffe8;}
[data-v="cst"] tr.encerrado td{opacity:0.5;}
[data-v="cst"] .pct-bar-wrap{display:flex;align-items:center;gap:6px;min-width:70px;}
[data-v="cst"] .pct-bar{flex:1;height:6px;background:var(--platinum);border-radius:4px;overflow:hidden;min-width:36px;}
[data-v="cst"] .pct-bar-fill{height:100%;background:linear-gradient(90deg,var(--lav1),var(--yellow));}
[data-v="cst"] .pct-num{font-size:11px;font-weight:800;color:var(--charcoal);width:32px;text-align:right;}
[data-v="cst"] .flag{width:9px;height:9px;border-radius:50%;background:#e2e2e2;display:inline-block;}
[data-v="cst"] .flag.on{background:#7bc142;}
[data-v="cst"] .doc-pill{display:inline-block;background:var(--platinum);color:var(--charcoal);font-weight:700;font-size:9.5px;padding:2px 6px;border-radius:10px;margin:1px 2px 1px 0;}
[data-v="cst"] .end-pill{display:inline-block;background:#e57373;color:#fff;font-weight:800;font-size:10px;padding:2px 8px;border-radius:12px;margin-left:6px;}
[data-v="cst"] .star{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;color:var(--charcoal);background:var(--yellow);padding:2px 7px;border-radius:20px;}
[data-v="cst"] .empty{text-align:center;padding:40px;color:var(--slate);font-size:14px;}
[data-v="cst"] footer{max-width:1260px;margin:0 auto 40px;padding:0 24px;font-size:12px;color:var(--slate);line-height:1.6;}
[data-v="cst"] footer a{color:var(--lav3);}
[data-v="cst"] footer .disclaimer{background:var(--white);border-left:4px solid var(--lav);padding:12px 16px;border-radius:6px;margin-top:10px;}
@media (max-width: 1050px){[data-v="cst"] .acc-header,[data-v="cst"] .ind-legend-row{grid-template-columns: 70px 1fr;}
[data-v="cst"] .ind-col,[data-v="cst"] .ind-legend-row div:nth-child(n+3){display:none;}

  }


.aviso-topo{background:#8f1f14;color:#fff;font-size:12px;font-weight:700;text-align:center;padding:7px 14px;letter-spacing:.3px;}
.estudo-box{max-width:1260px;margin:0 auto 36px;padding:14px 24px;font-size:12.5px;line-height:1.9;color:var(--slate);}
.estudo-box b{display:block;color:var(--charcoal);margin-bottom:2px;}
.estudo-box a{display:inline-block;margin:0 16px 0 0;color:var(--lav3);font-weight:700;text-decoration:none;}
.estudo-box a:hover{text-decoration:underline;}
#topnav a.nav-pos{margin-left:8px;}
</style>

lar ou crédito presumido. <b>Obs:<\/b> não existe, na planilha oficial, um indicador de \"Redutor de BC\" por código individual — esse indicador só existe no nível do CST (mostrado no cabeçalho do grupo); se precisarem dele por código, será necessário calcular a partir de % Red. IBS/CBS.","fonte":" Portal Nacional da NF-e — \"Tabela de Classificação Tributária do IBS e CBS\", publicada em {publicacao} (Informe Técnico 2025.002 v{versao}). Base legal: LC 214/2025 e LC 227/2026.","aviso":" atualizada periodicamente pela Receita Federal + Comitê Gestor do IBS. Códigos com fundo apagado e tag \"Encerrado\" já tiveram fim de vigência (ex: 220001 a 220003, encerrados em 01/01/2026). Confirme sempre a versão mais recente no Portal da NF-e e com a consultoria tributária.\n  ","versao":"1.71","publicacao":"30/10/2026","links":[{"texto":"Tabela CST/cClassTrib (Diversos)","href":"https://www.nfe.fazenda.gov.br/portal/listaConteudo.aspx?tipoConteudo=/NJarYc9nus="},{"texto":"Informes Técnicos NF-e","href":"https://www.nfe.fazenda.gov.br/portal/listaConteudo.aspx?tipoConteudo=hXzemuyNHW4="}]},"intro":"Ferramenta interna para consulta do CST e do cClassTrib do IBS/CBS (LC 214/2025). Cabeçalho e colunas ficam fixos ao rolar, como no Excel — use para localizar exceções, reduções e isenções antes de orientar a emissão e a classificação dos documentos fiscais.","lembrete":" confira se a tabela oficial de CST/cClassTrib foi atualizada — <a href=\"https://www.nfe.fazenda.gov.br/portal/listaConteudo.aspx?tipoConteudo=/NJarYc9nus=\" target=\"_blank\" style=\"color:var(--lav3);\">Portal da NF-e → Documentos → Diversos<\/a>. Este aviso não dispara sozinho: vale criar um lembrete recorrente na sua agenda (ex: todo primeiro dia útil do mês)."}</script>

la":"aula-virada-estoques-creditos","titulo":"A Virada de 2027: Estoques, Créditos Acumulados e Contratos"}]},"posBase":"https://4criso.github.io/pos-reforma/hub-pos-reforma.html","fonte":"Fichas dos perfis setoriais do hub do PÓS (seção \"Ficha do perfil para o SIS\")","gerado":"10/11/2026"},"setores":[{"id":"agronegocio","nome":"Agronegócio","aula":"aula-perfil-agronegocio","ficha":[["Setor","Agronegócio"],["Regime aplicável","Regra geral para quem é contribuinte, com regimes diferenciados (arts. 137, 138, 148 e 125), regime específico optativo das cooperativas (arts. 271 e 272) e regime do produtor rural não contribuinte (arts. 164 a 168)"],["Redução de alíquota","60% para insumos (Anexo IX) e produtos in natura; zero para hortícolas, frutas, ovos, cesta básica e máquinas destinadas a produtor não contribuinte"],["Particularidades de crédito","Crédito presumido nas compras de não contribuinte, com percentual anual; transferência de créditos do associado à cooperativa; diferimento de insumos; exportação com créditos mantidos"],["Benefícios em extinção","Benefícios de ICMS do setor, reduzidos de 2029 a 2032 e extintos em 2033, a mapear caso a caso"],["Obrigações acessórias do setor","Documento fiscal do adquirente discriminando valor da operação, crédito presumido e valor líquido; registro dos insumos no Ministério da Agricultura"],["Pontos de atenção","Limite de receita e opção pelo regime regular; percentual do crédito presumido; registro dos insumos; encerramento do diferimento; saldo credor de exportadoras"],["Itens do painel","Percentuais do crédito presumido de 2027"]],"painel":[{"tema":"Percentuais do crédito presumido na compra de produtor rural não contribuinte (2027)","estado":"O art. 168 da LC 214/2025 manda divulgar os percentuais todos os anos, até setembro, por ato conjunto do Ministro da Fazenda e do Comitê Gestor do IBS, com vigência em 1º de janeiro do ano seguinte. Em 10/11/2026 não localizei a publicação do ato para 2027. Os números da aula são hipóteses. A Resolução CGIBS 6/2026 prevê documento fiscal específico do adquirente (por fonte secundária).","data":"10/11/2026","prioridade":"alta","fonte":"LC 214/2025, art. 168, §4º; buscas em fontes secundárias (cnbsp, Radar da Reforma Tributária)"}]},{"id":"saude","nome":"Saúde","aula":"aula-perfil-saude","ficha":[["Setor","Saúde"],["Regime aplicável","Regimes diferenciados (arts. 128, 130, 131, 133, 144 e 146) e regime específico de planos de saúde (arts. 234 a 237). Cooperativas de saúde: art. 234, III, e arts. 271 e 272"],["Redução de alíquota","60% para serviços do Anexo III, medicamentos e dispositivos do Anexo IV; zero para dispositivos do Anexo XII, medicamentos por destinação terapêutica e compras de órgãos públicos e entidades imunes com CEBAS (SUS)"],["Particularidades de crédito","Folha sem crédito; alíquota zero mantém créditos (saldo credor a compensar ou ressarcir); crédito de plano para empregados só nas hipóteses previstas"],["Benefícios em extinção","Benefícios de ISS e de ICMS do setor, reduzidos de 2029 a 2032 e extintos em 2033, a mapear caso a caso"],["Documentos e classificações próprios","NBS do Anexo III (serviços), NCM dos Anexos IV e XII (dispositivos), registro na Anvisa e destinação terapêutica (medicamentos)"],["Pontos de atenção","Estrutura de custos (créditos); classificação; prova da destinação do medicamento; CEBAS e SUS; regime próprio dos planos"],["Itens do painel","Lista periódica de medicamentos com alíquota zero"]],"painel":[{"tema":"Lista periódica de medicamentos com alíquota zero (art. 146, LC 227/2026)","estado":"A LC 227/2026 revogou o Anexo XIV e passou a definir a alíquota zero de medicamentos por destinação terapêutica (doenças raras, negligenciadas, oncologia, diabetes, HIV/aids e outras IST e doenças cardiovasculares, mais o Programa Farmácia Popular por fonte secundária). A nova redação prevê atualização periódica por ato conjunto do Ministério da Fazenda e do Comitê Gestor do IBS. Em 10/11/2026 não localizei o primeiro ato.","data":"10/11/2026","prioridade":"media","fonte":"LC 227/2026, nova redação do art. 146 (Legisweb); Conjur (05/11/2026); Fecomércio RS"}]},{"id":"logistica-ecommerce","nome":"Logística, Transporte e E-commerce","aula":"aula-perfil-logistica-ecommerce","ficha":[["Setor","Logística, transporte e e-commerce"],["Regime aplicável","Regra geral para cargas e armazenagem (sem regime de redução localizado), com regime do transportador autônomo não contribuinte (art. 169), regimes de transporte de passageiros (art. 157 e arts. 284 e seguintes) e regras de plataformas digitais e de remessas internacionais (arts. 22, 23 e 96)"],["Redução de alíquota","Alíquota zero para veículos de carga destinados a transportador autônomo não contribuinte (art. 110, II). Percentuais do transporte coletivo de passageiros a conferir"],["Particularidades de crédito","Crédito presumido na contratação de autônomo não contribuinte ou MEI; crédito do frete contratado; extinção do débito do fornecedor"],["Benefícios em extinção","Benefícios de ICMS de localização e do transporte, reduzidos de 2029 a 2032 e extintos em 2033, a mapear caso a caso"],["Documentos e obrigações do setor","CT-e e MDF-e com campos de IBS e CBS; informações das plataformas ao Comitê Gestor e à Receita; split payment quando disponível"],["Pontos de atenção","Alíquota por destino; frete na base; responsabilidade de plataformas; remessa internacional; crédito presumido do autônomo"],["Itens do painel","Percentuais do transporte coletivo de passageiros"]],"painel":[{"tema":"Transporte coletivo de passageiros: percentuais do regime diferenciado e do regime específico (art. 157 e arts. 284 e seguintes)","estado":"A LC 214/2025 trata o transporte coletivo urbano, semiurbano e metropolitano (art. 157) e o intermunicipal, interestadual, ferroviário, hidroviário e aéreo regional (arts. 284 e seguintes). A LC 227/2026 incluiu percentuais de redução de 60%, 50%, 40% e 30% para certos sujeitos passivos em dispositivo desse regime. As fontes consultadas divergem sobre os percentuais, e o texto integral dos artigos não foi lido. A aula não afirma percentuais.","data":"10/11/2026","prioridade":"baixa","fonte":"LC 214/2025 (Planalto, Fazenda/MG); LC 227/2026"}]},{"id":"servicos-financeiros","nome":"Serviços Financeiros e Meios de Pagamento","aula":"aula-perfil-servicos-financeiros","ficha":[["Setor","Serviços financeiros e meios de pagamento"],["Regime aplicável","Regime específico (arts. 181 e 182), com regime dos arranjos de pagamento (art. 214 e seguintes), alíquotas fixadas (art. 233), importação (art. 231) e exportação (art. 232)"],["Redução de alíquota","Não há percentual de redução. A carga vem da base de cálculo reduzida e das alíquotas do art. 233 (10,85% em 2027 e 2028; 12,50% em 2033)"],["Particularidades de crédito","Dedução de despesas de captação na base; hipóteses específicas de crédito do tomador empresarial, a conferir"],["Benefícios em extinção","Não se aplica de forma geral. Serviços com ISS seguem a rampa do ISS"],["Documentos e obrigações do setor","Documentos fiscais com campos de IBS e CBS; apuração por natureza de receita; informações do split payment, quando disponível"],["Pontos de atenção","Base é a margem; regime de caixa em consórcios e seguros; split em instituições de pagamento; importação de serviços financeiros"],["Itens do painel","Partes do regime sem conferência"]],"painel":[{"tema":"Regime específico de serviços financeiros: partes sem conferência (base, arranjos de pagamento, exportação e ISS)","estado":"Foram lidos os arts. 181, 182 e 233 (com a LC 227/2026) e trechos dos arts. 223 e 231. Não foram lidos por inteiro: as deduções e a base das operações de crédito, os arranjos de pagamento (art. 214 e seguintes), a exportação (art. 232) e o ajuste das alíquotas para serviços que ainda sofrem ISS. A regulamentação do Comitê Gestor e do Banco Central não foi consultada. Os valores de 2031 e 2032 vêm do texto da LC 227/2026 e de fontes secundárias.","data":"10/11/2026","prioridade":"media","fonte":"LC 214/2025, arts. 181, 182, 223, 231 e 233 (Câmara e normas.leg.br); LC 227/2026; Machado Meyer"}]},{"id":"construcao-imobiliario","nome":"Construção e Imobiliário","aula":"aula-perfil-construcao-imobiliario","ficha":[["Setor","Construção e imobiliário"],["Regime aplicável","Regime específico de bens imóveis (arts. 251 a 270), para contribuintes do regime regular"],["Redução de alíquota","50% para alienação, construção civil, incorporação, administração e intermediação; 70% para locação, cessão onerosa e arrendamento (art. 261)"],["Particularidades de crédito","Saída reduzida e entrada com alíquota padrão, com possível saldo credor; apuração por obra"],["Redutores","Redutor de ajuste (vinculado ao imóvel) e redutor social de R$ 100.000 por imóvel residencial novo e R$ 30.000 por lote (art. 259)"],["Benefícios em extinção","Benefícios de ISS e ICMS do setor, reduzidos de 2029 a 2032 e extintos em 2033, a mapear caso a caso"],["Documentos e obrigações do setor","Identificação cadastral da obra; apuração por empreendimento com CNPJ ou CPF; documento fiscal com campos de IBS e CBS"],["Pontos de atenção","Saldo credor na obra; cadastro e contabilidade por obra; momento do pagamento na incorporação; controle dos redutores; limites da pessoa física"],["Itens do painel","Partes do regime de bens imóveis sem conferência"]],"painel":[{"tema":"Regime de bens imóveis: partes sem conferência (redutor de ajuste, locação, transição de obras e patrimônio de afetação)","estado":"Foram lidos o art. 251, o art. 259 (redutor social), o art. 261 (50% e 70%), o art. 270 e a existência da Seção V (incorporação e parcelamento). Não foram lidos por inteiro: o redutor de ajuste, o momento do fato gerador da locação, as regras de transição de obras e contratos em curso e o tratamento do regime especial das incorporadoras (patrimônio de afetação). A regulamentação do Comitê Gestor não foi consultada. A atualização do redutor social pelo IPCA vem de fonte secundária.","data":"10/11/2026","prioridade":"media","fonte":"LC 214/2025, arts. 251 a 270 (Legisweb, Radar da Reforma Tributária); LC 227/2026"}]},{"id":"energia-combustiveis-mineracao","nome":"Energia, Combustíveis e Mineração","aula":"aula-perfil-energia-combustiveis-mineracao","ficha":[["Setor","Energia, combustíveis e mineração"],["Regime aplicável","Regime específico monofásico de combustíveis (arts. 172 a 180); energia elétrica com recolhimento no fornecimento (art. 28); Imposto Seletivo na extração de bens minerais (arts. 413 e 422)"],["Redução de alíquota","Não há percentual de redução nos combustíveis. Alíquotas por unidade de medida, com biocombustíveis em alíquota inferior à dos fósseis. IS de minerais com teto de 0,25%"],["Particularidades de crédito","Vedação de crédito na aquisição de combustível para distribuição, comercialização ou revenda; crédito nas demais hipóteses; saldo credor de exportadoras"],["Benefícios em extinção","Benefícios de ICMS do setor, reduzidos de 2029 a 2032 e extintos em 2033, a mapear caso a caso. Monofásicos de PIS e COFINS saem em 2027"],["Documentos e obrigações do setor","CST e cClassTrib de monofasia; documentos fiscais com campos de IBS e CBS; controle de combustível para uso e para revenda"],["Pontos de atenção","Revenda sem crédito; uso do combustível como insumo; recolhimento da energia no fornecimento; IS na extração; saldo credor na exportação"],["Itens do painel","Valores das alíquotas por unidade de medida dos combustíveis"]],"painel":[{"tema":"Alíquotas por unidade de medida dos combustíveis (art. 174) e valores de 2027","estado":"O art. 174 manda fixar alíquotas uniformes, específicas por unidade de medida e diferenciadas por produto, reajustadas no ano anterior ao de sua vigência. Em 10/11/2026 não localizei os valores por litro de cada combustível para 2027. Os números da aula são hipóteses. O rol completo dos combustíveis do art. 172 (12 incisos) foi lido só em parte no texto da lei, e o restante vem de fonte secundária.","data":"10/11/2026","prioridade":"alta","fonte":"LC 214/2025, arts. 172 a 180 (Ministério da Fazenda, Legisweb, Conteúdo Jurídico); LC 227/2026"}]},{"id":"servicos-profissionais-contabilidade","nome":"Serviços Profissionais e Contabilidade","aula":"aula-perfil-servicos-profissionais-contabilidade","ficha":[["Setor","Serviços profissionais e contabilidade"],["Regime aplicável","Regime diferenciado de redução de 30% para as 18 profissões do art. 127, com local da operação no domicílio principal do adquirente (art. 11, X) e exportação imune (art. 80)"],["Redução de alíquota","30% sobre as alíquotas de IBS e CBS para os serviços das profissões da lista. Sem redução para profissões fora da lista"],["Particularidades de crédito","Folha sem crédito; crédito pelas aquisições (aluguel, sistemas e serviços); fornecedor do Simples com crédito limitado"],["Requisitos de sociedade","Sócios habilitados e sob fiscalização do conselho, serviços da atividade-fim prestados pelos sócios, e demais requisitos do §1º, II; natureza jurídica, união de profissões da lista e distribuição de lucros não impedem"],["Benefícios em extinção","Benefícios municipais de ISS, reduzidos de 2029 a 2032 e extintos em 2033, a mapear caso a caso"],["Documentos e obrigações do setor","NFS-e com campos de IBS e CBS; cadastro do cliente com a matriz"],["Pontos de atenção","Estrutura da sociedade; habilitação; preço por tipo de cliente; domicílio do cliente"],["Itens do painel","Partes do art. 127 sem conferência"]],"painel":[{"tema":"Redução de 30% do art. 127: partes sem conferência","estado":"Foram lidos o caput do art. 127, os incisos I a VIII, o §1º (I e as alíneas a e e do II), o §2º e o §3º, no texto do Planalto e de transcrições. Não foram lidos por inteiro: as alíneas b, c e d do §1º, II, o inciso X (referido no §3º) e os incisos IX a XVIII. Por fonte secundária: que a LC 227/2026 não alterou o art. 127 e que a sociedade não pode ter pessoa jurídica como sócia. Não foi tratado o destino do ISS fixo das sociedades uniprofissionais na transição.","data":"10/11/2026","prioridade":"baixa","fonte":"LC 214/2025, art. 127 (Planalto, modeloinicial); Marchesan; Barbieri Advogados"}]},{"id":"comercio-varejo","nome":"Comércio e Varejo","aula":"aula-perfil-comercio-varejo","ficha":[["Setor","Comércio e varejo"],["Regime aplicável","Regra geral (arts. 11, 12 e 15), com regimes diferenciados por produto (arts. 125, 128, 135 e 148) e crédito presumido de estoque e de bens móveis usados"],["Redução de alíquota","Zero para a cesta básica e hortifrúti; 60% para alimentos do Anexo VII e higiene e limpeza do Anexo VIII; padrão para os demais"],["Particularidades de crédito","Saldo credor com mix de saída reduzida e despesas gerais na alíquota padrão; crédito presumido do estoque de 1º/01/2027; crédito presumido na revenda de usados"],["Benefícios em extinção","Substituição tributária e benefícios de ICMS, reduzidos de 2029 a 2032 e extintos em 2033; monofásicos de PIS e COFINS saem em 2027"],["Documentos e obrigações do setor","Cadastro de produtos por NCM; documento fiscal com campos de IBS e CBS; inventário de 31/12/2026"],["Pontos de atenção","NCM e alíquota; saldo credor; canais B2B e B2C; estoque; descontos e fidelidade"],["Itens do painel","Listas de produtos por NCM nos anexos"]],"painel":[{"tema":"Listas por NCM dos Anexos I, VII, VIII e XV (cesta básica, alimentos, higiene e hortifrúti)","estado":"A alíquota de cada alimento e produto de higiene depende da classificação nos anexos da LC 214/2025. Foram lidos o art. 125 e o art. 128 no texto da lei, e os arts. 135 e 136 e o art. 148 em transcrições e fontes secundárias. As listas dos anexos não foram lidas item a item, e alterações pela LC 227/2026 e por atos posteriores não foram conferidas. A regra de transição de bens móveis usados foi lida em trecho, sem o número do artigo.","data":"10/11/2026","prioridade":"media","fonte":"LC 214/2025, arts. 125, 128, 135 e 136 (Planalto, Legisweb, normas.leg.br); TaxUp; buscadorncm"}]},{"id":"industria-zona-franca","nome":"Indústria e Zona Franca","aula":"aula-perfil-industria-zona-franca","ficha":[["Setor","Indústria e Zona Franca"],["Regime aplicável","Regra geral com crédito amplo (arts. 47 e seguintes) e regime da Zona Franca de Manaus (arts. 442 e seguintes)"],["Redução de alíquota","Alíquota zero do IPI em 2027, salvo Zona Franca. Alíquota zero do IBS e da CBS nas entradas nacionais na Zona Franca (art. 445)"],["Particularidades de crédito","Crédito de insumos e de bens de capital; créditos presumidos da Zona Franca (7,5% e 13,5% de IBS e 7% de CBS nas compras, 55%, 75% e 90,25% do saldo devedor de IBS nas saídas), sem ressarcimento em dinheiro"],["Benefícios em extinção","Benefícios de ICMS da indústria, reduzidos de 2029 a 2032 e extintos em 2033, com fundo de compensação nas hipóteses da lei"],["Documentos e obrigações do setor","Habilitação na Zona Franca; controles de entrada e de saída dos bens; documentos fiscais com campos de IBS e CBS"],["Pontos de atenção","Documento e extinção do débito do fornecedor; cadastro de produto por tipo de bem; prova de entrada na Zona Franca; saldo credor de exportadoras"],["Itens do painel","Partes do regime da Zona Franca sem conferência"]],"painel":[{"tema":"Regime da Zona Franca de Manaus: partes sem conferência (arts. 446 a 449, CBS nas saídas, exclusões, Lei 15.273/2025)","estado":"Foram lidos, no texto da lei, os arts. 444 e 445 e os percentuais dos créditos presumidos nas compras (IBS de 7,5% e 13,5%; CBS de 7%) e nas saídas do IBS (55%, 75% e 90,25%). Não foram lidos por inteiro: os arts. 446 a 449, o crédito presumido de CBS nas saídas, o art. 443 (suspensão), as exclusões de produtos, o percentual de 100% (fonte secundária), o veto ao crédito de CBS para bens com IPI zero (fonte secundária), a Lei 15.273/2025 e a regulamentação da SUFRAMA e do Comitê Gestor.","data":"10/11/2026","prioridade":"media","fonte":"LC 214/2025, arts. 442 a 450 (Câmara, Planalto, normas.leg.br); SUFRAMA; Escola Superior de Negócios; Simtax"}]},{"id":"educacao","nome":"Educação","aula":"aula-perfil-educacao","ficha":[["Setor","Educação"],["Regime aplicável","Regime diferenciado de redução de 60% (art. 129 e Anexo II), CBS zero no Prouni (art. 308) e imunidade de entidades sem fins lucrativos (art. 9º, III)"],["Redução de alíquota","60% para os serviços do Anexo II, por NBS; CBS zero para o ensino superior no Prouni; alíquota padrão para o que não consta do anexo"],["Particularidades de crédito","Folha sem crédito; crédito pelas aquisições (aluguel, energia, material e sistemas); fornecedor do Simples com crédito limitado"],["Benefícios em extinção","Benefícios municipais de ISS, reduzidos de 2029 a 2032 e extintos em 2033, a mapear caso a caso"],["Documentos e obrigações do setor","Classificação por NBS; segregação das receitas; controle de bolsas do Prouni; comprovação dos requisitos da imunidade"],["Pontos de atenção","Segregação da receita; NBS; folha sem crédito; Prouni; manutenção da imunidade"],["Itens do painel","Partes do regime sem conferência"]],"painel":[{"tema":"Educação: Anexo II (NBS), §§ do art. 308 e requisitos da imunidade","estado":"Foram lidos o art. 129 e o parágrafo único, o caput do art. 308 e o inciso III do art. 9º (referência) no texto da lei. Não foram lidos por inteiro: o Anexo II com as NBS, os §§ do art. 308 (a aula usa o §1º, II, por fonte secundária, na leitura de que a CBS zero vale na proporção da ocupação efetiva das bolsas), os requisitos completos da imunidade e a regra de pesquisa e inovação. A regulamentação do Comitê Gestor e do Ministério da Educação não foi consultada.","data":"10/11/2026","prioridade":"media","fonte":"LC 214/2025, arts. 9º, 129 e 308 (Câmara, Legisweb); Radar da Reforma Tributária; Voga; Migalhas"}]},{"id":"turismo-alimentacao","nome":"Turismo, Hotelaria e Alimentação Fora do Lar","aula":"aula-perfil-turismo-alimentacao","ficha":[["Setor","Turismo, hotelaria e alimentação fora do lar"],["Regime aplicável","Regime específico do Capítulo VII (arts. 273 a 291): bares e restaurantes, hotelaria, parques de diversão e temáticos e agências de turismo"],["Redução de alíquota","40% sobre a alíquota de referência (art. 281)"],["Particularidades de crédito","O fornecedor se credita pelas regras gerais; o adquirente não toma crédito na alimentação e na hospedagem do regime (por fonte secundária); agência de turismo se credita, exceto dos valores deduzidos da base"],["Base de cálculo","Valor da operação na hotelaria e nos parques; valor da operação menos os repasses a fornecedores na agência de turismo (art. 289)"],["Benefícios em extinção","Benefícios de ICMS e ISS do setor, reduzidos de 2029 a 2032 e extintos em 2033, a mapear caso a caso"],["Documentos e obrigações do setor","Cadastro de produtos e cardápio por alíquota; documento do agenciamento com os repasses; documentos fiscais com campos de IBS e CBS"],["Pontos de atenção","O que entra no regime; crédito de entrada; cliente empresa; agência de turismo; locação por temporada"],["Itens do painel","Partes do regime sem conferência"]],"painel":[{"tema":"Regime específico de bares, restaurantes, hotelaria, parques e agências de turismo: partes sem conferência","estado":"Foram lidos, no texto da lei, o art. 277, o art. 280 (base na hotelaria), o art. 281 (redução de 40%), o art. 289 (base e alíquota da agência), o art. 291 (crédito da agência) e o conceito de hotelaria. Não foram lidos por inteiro: os arts. 273 a 276 (bares e restaurantes), 278, 279, 282 a 287 e 290, e a vedação de crédito do adquirente (arts. 276 e 283, por fonte secundária). Itens fora do regime (revenda sem preparo e bebidas alcoólicas) e a gorjeta também vêm de fonte secundária ou não foram conferidos. A alíquota de referência depende de resolução do Senado.","data":"10/11/2026","prioridade":"media","fonte":"LC 214/2025, Capítulo VII (Planalto, Câmara, normas.leg.br, Legisweb); TaxUp; Escola Superior de Negócios; Martinelli"}]},{"id":"software-servicos-digitais","nome":"Software e Serviços Digitais","aula":"aula-perfil-software-servicos-digitais","ficha":[["Setor","Software e serviços digitais"],["Regime aplicável","Regra geral para licenciamento de bens imateriais e para serviços (art. 3º), com local da operação no domicílio principal do adquirente (art. 11, X e §3º), importação com o adquirente como contribuinte (art. 21, V), exportação imune (art. 80) e responsabilidade de plataformas (arts. 22 e 23)"],["Redução de alíquota","Sem redução específica localizada para software e serviços de TI. A redução de 30% depende de a atividade ser de profissão fiscalizada por conselho"],["Particularidades de crédito","Crédito pelas aquisições (nuvem, licenças, serviços e importações); folha de pagamento sem crédito; extinção do débito do fornecedor"],["Benefícios em extinção","Benefícios municipais de ISS, reduzidos de 2029 a 2032 e extintos em 2033, a mapear caso a caso"],["Documentos e obrigações do setor","NFS-e com campos de IBS e CBS; classificação por NBS e cClassTrib; cadastro do cliente com a matriz"],["Pontos de atenção","Domicílio do adquirente; classificação de licença, assinatura e serviço; importação intragrupo; exportação; efeito por tipo de cliente"],["Itens do painel","Regulamentação do local da operação e do cadastro do adquirente"]],"painel":[{"tema":"Local da operação de serviços e bens imateriais: nova redação do art. 11, X, e cadastro com identificação única","estado":"A LC 227/2026 deu nova redação ao inciso X do art. 11 (domicílio principal do adquirente residente no País, ou do destinatário se o adquirente for do exterior) e o §3º usa o cadastro com identificação única, com o estabelecimento matriz como domicílio principal da pessoa jurídica. A regulamentação do Comitê Gestor sobre o cadastro e sobre a aplicação prática não foi lida.","data":"10/11/2026","prioridade":"media","fonte":"LC 214/2025, art. 11 (texto atualizado pela LC 227/2026); Resolução CGIBS 6/2026 (não lida)"}]}]}</script>

"id":"b1o7","texto":"Remete bens para conserto, industrialização ou demonstração"},{"id":"b1o8","texto":"Loca bens"},{"id":"b1o9","texto":"Concede ou toma mútuo oneroso"}]}]},{"id":"b2","titulo":"Créditos e sua gestão","tipo":"preparo","descricao":"Mede o quanto a empresa está preparada para gerar, comprovar e usar créditos de IBS e CBS.","grupos":[{"id":"b2g1","titulo":"Entradas (compras)","itens":[{"id":"b2e1","texto":"As compras são feitas com documento fiscal idôneo (NF-e ou NFS-e)."},{"id":"b2e2","texto":"A empresa sabe quais fornecedores estão no regime regular de IBS e CBS e quais estão no Simples Nacional, em que o crédito do adquirente é limitado.","dica":"Art. 47, §9º"},{"id":"b2e3","texto":"A empresa acompanha se o tributo do fornecedor foi extinto, condição para o crédito.","dica":"Arts. 27 e 47"},{"id":"b2e4","texto":"As aquisições de uso e consumo da atividade estão mapeadas, pois passam a gerar crédito no regime regular.","dica":"Exceto uso ou consumo pessoal (art. 57)"},{"id":"b2e5","texto":"Os prazos de pagamento aos fornecedores são controlados, pelo efeito sobre o momento do crédito."},{"id":"b2e6","texto":"O ERP rastreia, por documento, o pagamento e a extinção do tributo do fornecedor."}]},{"id":"b2g2","titulo":"Saídas (vendas e serviços)","itens":[{"id":"b2s1","texto":"Os documentos fiscais de saída são emitidos com classificação e destaques corretos."},{"id":"b2s2","texto":"A empresa sabe qual parcela da receita vai a clientes que tomam crédito (B2B) e qual vai a consumidores finais."},{"id":"b2s3","texto":"A pontualidade dos clientes foi avaliada, pelo efeito do split payment sobre o recebimento."},{"id":"b2s4","texto":"A empresa compara o prazo de recebimento com a apuração por competência, que antecipa o débito."},{"id":"b2s5","texto":"O efeito das vendas parceladas sobre o caixa foi avaliado."}]},{"id":"b2g3","titulo":"Extinção do tributo","itens":[{"id":"b2x1","texto":"A empresa conhece as formas de extinção do tributo: pagamento direto, split payment, compensação e pagamento pelo responsável.","dica":"Art. 27"},{"id":"b2x2","texto":"A empresa sabe em que operações o split payment pode reter o imposto no recebimento."},{"id":"b2x3","texto":"Há rotina para compensar ou ressarcir créditos acumulados."},{"id":"b2x4","texto":"Foram mapeadas as hipóteses de responsabilidade tributária que alcançam a empresa (plataformas, adquirentes e importações).","dica":"Arts. 21 a 23"}]}]},{"id":"b3","titulo":"Benefícios e regimes fiscais","tipo":"dependencia","descricao":"Marque Sim quando a empresa usa ou depende do regime, e Parcial quando depende em parte. Quanto mais itens marcados, maior a dependência de regras que mudam.","grupos":[{"id":"b3g1","titulo":"Regimes diferenciados (alíquota reduzida)","itens":[{"id":"b3d1","texto":"Serviços de profissões intelectuais fiscalizadas por conselho (redução de 30%).","dica":"Art. 127"},{"id":"b3d2","texto":"Serviços de saúde (redução de 60%).","dica":"Art. 130"},{"id":"b3d3","texto":"Serviços de educação (redução de 60%).","dica":"Art. 129"},{"id":"b3d4","texto":"Medicamentos ou dispositivos médicos (redução de 60% ou alíquota zero).","dica":"Arts. 131, 133, 144 e 146"},{"id":"b3d5","texto":"Alimentos da cesta básica, hortifrúti ou produtos agropecuários (alíquota zero ou redução).","dica":"Arts. 125, 137, 138 e 148"},{"id":"b3d6","texto":"Produtos de higiene pessoal e limpeza de consumo popular (redução de 60%).","dica":"Art. 128, VII"},{"id":"b3d7","texto":"Dispositivos de acessibilidade para pessoas com deficiência (redução de 60%).","dica":"Art. 128"}]},{"id":"b3g2","titulo":"Regimes específicos","itens":[{"id":"b3r1","texto":"Bares, restaurantes e lanchonetes.","dica":"Capítulo VII (arts. 273 a 291)"},{"id":"b3r2","texto":"Hotelaria, parques de diversão e parques temáticos.","dica":"Capítulo VII (arts. 273 a 291)"},{"id":"b3r3","texto":"Agências de turismo.","dica":"Arts. 288 a 291"},{"id":"b3r4","texto":"Cooperativas.","dica":"Arts. 271 e 272"},{"id":"b3r5","texto":"Planos de assistência à saúde.","dica":"Arts. 234 a 237"},{"id":"b3r6","texto":"Serviços financeiros, seguros ou meios de pagamento.","dica":"Arts. 181 e 182"},{"id":"b3r7","texto":"Combustíveis (incidência única, por unidade de medida).","dica":"Arts. 172 a 180"},{"id":"b3r8","texto":"Bens imóveis (construção, incorporação, locação ou alienação).","dica":"Arts. 251 a 270"},{"id":"b3r9","texto":"Transporte coletivo de passageiros.","dica":"Art. 157 e arts. 284 e seguintes"}]},{"id":"b3g3","titulo":"Benefícios e regimes que saem ou mudam","itens":[{"id":"b3b1","texto":"Substituição tributária do ICMS."},{"id":"b3b2","texto":"DIFAL de ICMS."},{"id":"b3b3","texto":"Incentivos de ICMS ou de ISS, estaduais ou municipais."},{"id":"b3b4","texto":"Redução de base de cálculo ou diferimento de ICMS."},{"id":"b3b5","texto":"Regimes monofásicos de PIS e COFINS."},{"id":"b3b6","texto":"PIS e COFINS no regime cumulativo em parte da receita, sem crédito de insumos."},{"id":"b3b7","texto":"IPI com redução ou isenção, ou produção na Zona Franca de Manaus."},{"id":"b3b8","texto":"Incentivos de instalação em localidades específicas (filiais)."},{"id":"b3b9","texto":"Desoneração da folha por contribuição sobre a receita bruta (CPRB), em reoneração gradual.","dica":"Lei 14.973/2024"}]}]},{"id":"b4","titulo":"Classificação fiscal e documentos","tipo":"preparo","descricao":"Mede a qualidade do cadastro fiscal e dos documentos eletrônicos.","grupos":[{"id":"b4g1","titulo":"Classificação de produtos e serviços","itens":[{"id":"b4n1","texto":"As NCM dos produtos estão revisadas e atualizadas."},{"id":"b4n2","texto":"Os códigos de serviço (LC 116 e NBS) estão corretos e revisados."},{"id":"b4n3","texto":"Os CFOP das operações foram mapeados."},{"id":"b4n4","texto":"A empresa distingue as operações onerosas das não onerosas."},{"id":"b4n5","texto":"Os itens com regime diferenciado de IBS e CBS estão identificados."},{"id":"b4n6","texto":"Os itens com alíquota zero estão identificados."},{"id":"b4n7","texto":"A empresa começou a analisar as alíquotas pelo destino da operação.","dica":"Arts. 11 e 15"}]},{"id":"b4g2","titulo":"Documentos fiscais eletrônicos","itens":[{"id":"b4f1","texto":"O ERP emite os documentos fiscais com os campos de IBS e CBS, cuja obrigatoriedade é por etapas."},{"id":"b4f2","texto":"O aceite das NF-e de entrada está formalizado."},{"id":"b4f3","texto":"Há controle do prazo de cancelamento de documentos fiscais."},{"id":"b4f4","texto":"A idoneidade do emitente dos documentos de entrada é verificada."},{"id":"b4f5","texto":"O débito e o crédito são rastreáveis até o documento fiscal."},{"id":"b4f6","texto":"O cadastro de clientes traz a matriz de cada cliente, que define o destino de serviços e bens imateriais.","dica":"Art. 11, X"}]}]},{"id":"b5","titulo":"Formação de preço e fluxo de caixa","tipo":"preparo","descricao":"Mede o quanto a empresa já olhou para preço e caixa na transição.","grupos":[{"id":"b5g1","titulo":"Preço","itens":[{"id":"b5p1","texto":"A empresa sabe quais tributos estão embutidos no preço de cada produto ou serviço."},{"id":"b5p2","texto":"Há plano para retirar o PIS e a COFINS do preço em 2027."},{"id":"b5p3","texto":"Há plano para retirar o ICMS e o ISS do preço, de forma gradual, de 2029 a 2032."},{"id":"b5p4","texto":"A revisão dos preços durante a transição está planejada."},{"id":"b5p5","texto":"A margem foi analisada com e sem o crédito concedido ao cliente."},{"id":"b5p6","texto":"O efeito de o imposto passar a aparecer por fora no preço foi avaliado."},{"id":"b5p7","texto":"A empresa avaliou preços diferentes para clientes que tomam crédito (B2B) e para os que não tomam (B2C)."}]},{"id":"b5g2","titulo":"Caixa","itens":[{"id":"b5k1","texto":"A empresa entende que o débito segue a competência e o crédito segue a extinção do tributo do fornecedor."},{"id":"b5k2","texto":"O fluxo de caixa foi projetado considerando o atraso do crédito."},{"id":"b5k3","texto":"O efeito das vendas parceladas sobre o caixa foi analisado."},{"id":"b5k4","texto":"Os fornecedores pontuais foram mapeados, para antecipar o crédito."},{"id":"b5k5","texto":"O capital de giro foi avaliado para suportar a restrição de crédito."},{"id":"b5k6","texto":"O efeito do split payment no caixa foi analisado."}]}]},{"id":"b6","titulo":"Planejamento e estrutura","tipo":"preparo","descricao":"Mede se a análise tributária e a estrutura da empresa foram revistas.","grupos":[{"id":"b6g1","titulo":"Análise tributária","itens":[{"id":"b6a1","texto":"Os tributos sobre o consumo (IBS, CBS e Imposto Seletivo) foram analisados."},{"id":"b6a2","texto":"Os tributos sobre a renda (IRPJ e CSLL) foram reavaliados no novo contexto."},{"id":"b6a3","texto":"Os tributos sobre a folha, como a CPRB e as contribuições previdenciárias, foram considerados."},{"id":"b6a4","texto":"A estrutura logística e a localização dos estabelecimentos foram revistas, pelo efeito do destino."},{"id":"b6a5","texto":"Os clientes foram analisados quanto ao regime (que tomam crédito ou não)."},{"id":"b6a6","texto":"Os fornecedores foram analisados quanto ao regime tributário, pelo efeito sobre o crédito."},{"id":"b6a7","texto":"O enquadramento no Simples Nacional contra o regime regular foi reavaliado, se aplicável."}]},{"id":"b6g2","titulo":"Estrutura societária e operacional","itens":[{"id":"b6e1","texto":"A estrutura societária foi avaliada frente à reforma."},{"id":"b6e2","texto":"Reorganizações ou desmembramentos foram analisados."},{"id":"b6e3","texto":"Oportunidades em regimes diferenciados ou específicos foram avaliadas."},{"id":"b6e4","texto":"Contratos com clientes e fornecedores foram revisados quanto a preço, tributos e documentos."},{"id":"b6e5","texto":"As contingências tributárias atuais foram mapeadas."}]}]},{"id":"b7","titulo":"Maturidade e preparação","tipo":"preparo","descricao":"Mede conhecimento, sistemas e processos internos para a transição.","grupos":[{"id":"b7g1","titulo":"Conhecimento e capacitação","itens":[{"id":"b7k1","texto":"Gestores e sócios foram informados sobre os impactos da reforma."},{"id":"b7k2","texto":"A equipe contábil e financeira está capacitada na LC 214/2025."},{"id":"b7k3","texto":"Um assessor tributário com experiência na reforma foi consultado."},{"id":"b7k4","texto":"O cronograma de transição (2026 a 2033) é conhecido pela empresa."}]},{"id":"b7g2","titulo":"Sistemas e tecnologia","itens":[{"id":"b7s1","texto":"O ERP será atualizado para IBS, CBS e Imposto Seletivo."},{"id":"b7s2","texto":"A apuração assistida foi avaliada."},{"id":"b7s3","texto":"O controle do split payment está previsto no sistema."},{"id":"b7s4","texto":"A emissão dos documentos fiscais com os novos campos está mapeada."},{"id":"b7s5","texto":"A integração com os sistemas da Receita Federal e do Comitê Gestor do IBS foi avaliada."}]},{"id":"b7g3","titulo":"Processos internos","itens":[{"id":"b7p1","texto":"O mapa de impacto da empresa foi elaborado (operações, créditos, débitos e incentivos)."},{"id":"b7p2","texto":"O relatório de cenário foi apresentado aos sócios."},{"id":"b7p3","texto":"Há plano de ação formalizado para a adaptação."},{"id":"b7p4","texto":"A revisão periódica do planejamento tributário está agendada."}]}]}]}</script>

s":"pendente"},{"item":"Modelo de receita","valor":"—","status":"pendente"},{"item":"ERP utilizado","valor":"—","status":"pendente"},{"item":"Relação com a matriz (Alemanha)","valor":"—","status":"pendente"},{"item":"Principais clientes","valor":"—","status":"pendente"},{"item":"Principais fornecedores","valor":"—","status":"pendente"}],"frentes":[{"n":"1.1","title":"Diagnóstico e impacto específico na empresa","status":"todo","desc":"Como a empresa fatura e como cada operação se classifica no IBS/CBS, que tributa pelo objeto da operação (NBS e NCM, com o cClassTrib), e não pelo CNAE. Inclui o tratamento de cada estabelecimento, a importação de serviços e bens imateriais do exterior (o adquirente no País é o contribuinte, arts. 63 a 70 da LC 214/2025) e a exportação de serviços (fornecimento a residente no exterior com consumo no exterior, art. 80).","items":["Confirmar o modelo de receita e o código NBS ou NCM de cada oferta","Mapear as operações de cada estabelecimento por NBS, NCM e cClassTrib, e não pelo CNAE","Verificar as operações com o exterior: importação de serviços ou bens imateriais e exportação"]},{"n":"1.2","title":"Fluxo de caixa e Split Payment","status":"todo","desc":"Como o split payment, quando implantado, pode afetar o recebimento das vendas e o capital de giro. A data de implantação ainda depende de regulamentação.","items":["Simular o impacto do split payment no fluxo de caixa","Levantar o que precisa ser antecipado com a Tesouraria/Financeiro"]},{"n":"1.3","title":"Créditos tributários (transição PIS/COFINS/ICMS → IBS/CBS)","status":"todo","desc":"Levantamento dos créditos acumulados e dos prazos de aproveitamento. Créditos de PIS e COFINS escriturados até 31/12/2026 permanecem utilizáveis, com o prazo que já corria, e podem ser compensados com a CBS (art. 378 da LC 214/2025). Os créditos de transição dos arts. 379 a 381 têm prazo de cinco anos (art. 383). O saldo credor de ICMS segue o art. 134 do ADCT. O crédito do adquirente também depende da extinção do débito do fornecedor (arts. 27, 47 e 48).","items":["Levantar os créditos acumulados hoje (PIS e COFINS não cumulativos e, se houver, ICMS)","Montar o cronograma de utilização dentro dos prazos legais (cinco anos para os créditos dos arts. 379 a 381; regra própria para o saldo de ICMS)","Mapear os principais fornecedores quanto ao regime tributário (regular ou Simples Nacional) e ao cumprimento das obrigações, que afetam o crédito do adquirente"]},{"n":"1.4","title":"Sistemas e Tecnologia (ERP e processos)","status":"todo","desc":"Adequação do ERP às novas regras de crédito e débito e apoio à consultoria com ferramentas internas.","items":["Usar a consulta de CST/cClassTrib, construída com os dados oficiais do Informe Técnico 2025.002","Mapear pontos de integração com o ERP e com a consultoria"],"link":{"rota":"cst","label":"Abrir ferramenta CST/cClassTrib →"}},{"n":"1.5","title":"Fornecedores, clientes e cadeia de suprimentos","status":"todo","desc":"Mapeamento de fornecedores por regime tributário e cumprimento das obrigações, e impacto em decisões de compra.","items":["Mapear os principais fornecedores e o regime tributário de cada um (regular ou Simples Nacional)","Mapear os principais clientes e a natureza das operações (empresas que se creditam ou consumidores finais)"]},{"n":"1.6","title":"Cronograma regulatório e obrigações acessórias","status":"todo","desc":"Linha do tempo oficial da reforma e novas obrigações acessórias.","items":["Montar a linha do tempo 2026–2033 com os marcos que afetam a empresa","Acompanhar as novas obrigações acessórias (campos de IBS e CBS nos documentos fiscais e apuração assistida) conforme os atos da Receita Federal e do Comitê Gestor do IBS"]}],"cstRelevantes":[]}</script>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};

/* ===== Dados e perfis ===== */
var CST=JSON.parse($('cst-data').textContent);
var SETORES=JSON.parse($('setores-data').textContent);
var PERFIS=Array.prototype.slice.call(document.querySelectorAll('script[data-perfil]')).map(function(s){return JSON.parse(s.textContent);});
var STORE='sis-perfil';
var perfil=PERFIS[0];
try{var sid=localStorage.getItem(STORE);var sp=PERFIS.filter(function(x){return x.id===sid;})[0];if(sp)perfil=sp;}catch(e){}
var planoOpen={};
var cstOpen={};
var cstUI={q:'',cst:'',onlyRel:false,hideEnc:false};

function fmt(s){return String(s==null?'':s).replace(/\{versao\}/g,CST.meta.versao).replace(/\{publicacao\}/g,CST.meta.publicacao);}
/* ===== Consulta CST: lógica pura ===== */
function cstRows(p){
  var rel={};((p&&p.cstRelevantes)||[]).forEach(function(c){rel[c]=true;});
  return CST.data.map(function(r){var x=r.slice();x[6]=!!rel[r[2]];return x;});
}
function cstFilter(rows,f){
  var q=(f.q||'').trim().toLowerCase();
  return rows.filter(function(row){
    var c=row[0],label=row[1],code=row[2],desc=row[3],enc=row[5],star=row[6];
    if(f.cst&&c!==f.cst)return false;
    if(f.onlyRel&&!star)return false;
    if(f.hideEnc&&enc)return false;
    if(q){var hay=(c+label+code+desc).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });
}
function dotsHtml(c){
  var m=CST.cstIndicators[c]||{};
  var cols=['exigeTrib','monofasica','reducao','diferimento','transfCred','credPresZFM','ajusteCompet','redutorBC'];
  return cols.map(function(k){return '<div class="ind-col"><div class="dot '+(m[k]?'on':'')+'"></div></div>';}).join('');
}
function pctCell(v){
  v=v||0;
  return '<div class="pct-bar-wrap"><div class="pct-bar"><div class="pct-bar-fill" style="width:'+v+'%;"></div></div><span class="pct-num">'+v+'%</span></div>';
}
function cstResultsHtml(rows,f,open){
  var filtered=cstFilter(rows,f);
  var count=filtered.length+' código(s) de '+rows.length+' no total';
  if(!filtered.length)return {count:count,html:'<div class="empty">Nenhum código encontrado.</div>'};
  var groups={},order=[];
  filtered.forEach(function(row){var k=row[0];if(!groups[k]){groups[k]=[];order.push(k);}groups[k].push(row);});
  var autoExpand=!!(f.q&&f.q.trim()||f.cst||f.onlyRel||f.hideEnc);
  var html='<div class="ind-legend-row"><div>CST</div><div>Descrição</div>'+
    '<div>Exige</div><div>Mono</div><div>Redução</div><div>Diferim.</div><div>Transf.</div><div>Créd.ZFM</div><div>Ajuste</div><div>Red.BC</div></div>'+
  order.map(function(c){
    var rs=groups[c],label=rs[0][1],isOpen=autoExpand?true:!!open[c];
    return '<div class="accordion">'+
      '<div class="acc-header '+(isOpen?'open':'')+'" data-cst="'+esc(c)+'">'+
        '<div class="badge">'+esc(c)+'</div>'+
        '<div class="label"><span class="chev">▶</span> '+esc(label)+'</div>'+dotsHtml(c)+
      '</div>'+
      '<div class="acc-body '+(isOpen?'expanded':'')+'"><table><thead><tr>'+
        '<th>Código</th><th>Descrição</th><th>% Red. IBS</th><th>% Red. CBS</th><th>Trib. Reg.</th><th>Créd. Pres.</th><th>Documentos</th></tr></thead><tbody>'+
        rs.map(function(r){
          return '<tr class="'+(r[6]?'hl':'')+' '+(r[5]?'encerrado':'')+'">'+
            '<td class="code">'+esc(r[2])+'</td>'+
            '<td>'+esc(r[3])+(r[6]?'<span class="star">relevante</span>':'')+(r[5]?'<span class="end-pill">Encerrado</span>':'')+'</td>'+
            '<td>'+pctCell(r[7])+'</td><td>'+pctCell(r[8])+'</td>'+
            '<td><span class="flag '+(r[9]?'on':'')+'"></span></td><td><span class="flag '+(r[10]?'on':'')+'"></span></td>'+
            '<td>'+(r[4].map(function(d){return '<span class="doc-pill">'+esc(d)+'</span>';}).join('')||'<span style="color:#bbb;font-size:11px;">—</span>')+'</td></tr>';
        }).join('')+
      '</tbody></table></div></div>';
  }).join('');
  return {count:count,html:html};
}

/* ===== Plano de ação: lógica pura ===== */
var STATUS_LABEL={todo:'Não iniciado',wip:'Em andamento',done:'Concluído'};
function planoResumo(frentes){
  var n=frentes.length,done=frentes.filter(function(f){return f.status==='done';}).length,wip=frentes.filter(function(f){return f.status==='wip';}).length;
  var pct=n?Math.round((done+wip)/n*100):0;
  var partes=[];
  if(wip)partes.push(wip+' de '+n+' frentes em andamento');
  partes.push(done?(done+' concluída'+(done>1?'s':'')):'nenhuma concluída ainda');
  return {pct:pct,texto:partes.join(', ')};
}
function frentesHtml(frentes,open){
  return frentes.map(function(f){
    var isOpen=!!open[f.n];
    return '<div class="accordion"><div class="acc-header '+(isOpen?'open':'')+'" data-n="'+esc(f.n)+'">'+
      '<div class="num">'+esc(f.n)+'</div><div class="titlewrap"><h3>'+esc(f.title)+'</h3></div>'+
      '<span class="status-tag '+esc(f.status)+'">'+STATUS_LABEL[f.status]+'</span><span class="chev">▶</span></div>'+
      '<div class="acc-body '+(isOpen?'expanded':'')+'"><div class="acc-body-inner"><p>'+esc(f.desc)+'</p>'+
      '<ul>'+f.items.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ul>'+
      (f.link?'<a class="tool-link" href="#'+esc(f.link.rota)+'">'+esc(f.link.label)+'</a>':'')+
      '</div></div></div>';
  }).join('');
}

/* ===== Visões ===== */
function brand(p,h){
  return p.logo?'<img src="'+p.logo+'" alt="'+esc(p.logoAlt||p.nome)+'" style="height:'+h+'px;width:auto;display:block;">':'<span class="sis-brand">SIS<small>Reforma Tributária</small></span>';
}

/* ===== Ficha setorial ===== */
function setorId(p){
  var id='';try{id=localStorage.getItem('sis-setor-'+p.id)||'';}catch(e){}
  if(id==='-')return '';
  if(!id)id=p.setor||'';
  return SETORES.setores.filter(function(x){return x.id===id;}).length?id:'';
}
function setorDe(p){var id=setorId(p);return SETORES.setores.filter(function(x){return x.id===id;})[0]||null;}
function fichaCampo(s,campo){var r=(s&&s.ficha||[]).filter(function(x){return x[0]===campo;})[0];return r?r[1]:'';}
function setorHtml(p){
  var s=setorDe(p),pos=SETORES.meta.posBase||'';
  var opts='<option value="-"'+(s?'':' selected')+'>— Escolha um setor —</option>'+SETORES.setores.map(function(x){return '<option value="'+esc(x.id)+'"'+(s&&s.id===x.id?' selected':'')+'>'+esc(x.nome)+'</option>';}).join('');
  var corpo;
  if(!s){corpo='<div class="vazio">Escolha o setor da empresa para ver os parâmetros do regime tributário: regime aplicável, redução de alíquota, crédito, benefícios em extinção, documentos e pontos de atenção.</div>';}
  else{
    corpo='<div class="section-title">Ficha: '+esc(s.nome)+'</div><div class="profile-table"><table>'+
      s.ficha.map(function(r){return '<tr><td class="item">'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>';}).join('')+'</table></div>'+
      (pos?'<a class="linkpos" href="'+esc(pos)+'#'+esc(s.aula)+'" target="_blank" rel="noopener"><span class="material-symbols-outlined">menu_book</span>Ler o perfil completo no PÓS ↗</a>':'')+
      '<div class="section-title">Acompanhamento no painel do PÓS</div><div class="painel-list">'+
      (s.painel.length?s.painel.map(function(i){return '<div class="painel-item"><b>'+esc(i.tema)+'</b><span class="pri '+esc(i.prioridade)+'">'+esc(i.prioridade)+'</span><div>'+esc(i.estado)+'</div><div class="meta">Verificado em '+esc(i.data)+(i.fonte?' · Fonte: '+esc(i.fonte):'')+'</div></div>';}).join(''):'<div class="painel-item">Nenhum item acompanhado.</div>')+'</div>';
  }
  return '<div data-v="setor">'+
  '<header><div class="brand">'+brand(p,36)+'</div><h1>Ficha setorial — Reforma Tributária</h1><p>Parâmetros do regime tributário de cada setor, gerados a partir dos perfis setoriais do PÓS (LC 214/2025). Servem de modelo inicial para o perfil de empresa. Os dados reais da empresa vêm do perfil, e não desta ficha.</p></header>'+
  '<main><div class="setor-sel"><label for="setorSel">Setor do perfil '+esc(p.nome)+'</label><select id="setorSel">'+opts+'</select><span class="nota">A escolha fica salva neste navegador, para o perfil selecionado no topo.</span></div>'+corpo+'</main>'+
  '<footer><div>Material de estudo, que não substitui a leitura da norma nem a orientação de um profissional habilitado. Confira as fontes oficiais antes de aplicar, e veja no PÓS o que ainda não foi conferido em cada setor.</div></footer></div>';
}
function setorBox(p){
  var s=setorDe(p);if(!s)return '';
  var pts=fichaCampo(s,'Pontos de atenção');
  var lista=pts?pts.split(/;\s*/).filter(Boolean):[];
  return '<div class="setor-box"><h4>Pontos de atenção do setor (modelo: '+esc(s.nome)+')</h4>'+(lista.length?'<ul>'+lista.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'')+'<a href="#setor">Ver a ficha setorial completa →</a></div>';
}

/* ===== Diagnóstico por checklist ===== */
var CHK=JSON.parse($('checklist-data').textContent);
var DIAG_LIMITES={depCritico:40,b7Critico:40,depAlto:30,baseAlto:50,depModerado:15,prepModerado:60,depNeutro:25,minResp:0.5};
function chkItens(){var o=[];CHK.blocos.forEach(function(b){b.grupos.forEach(function(g){g.itens.forEach(function(i){o.push({id:i.id,bloco:b.id,tipo:b.tipo,texto:i.texto,grupo:g.titulo});});});});return o;}
function diagResp(p){
  var r={},sug={};
  (p.diagSugestoes&&Object.keys(p.diagSugestoes)||[]).forEach(function(k){r[k]=p.diagSugestoes[k];sug[k]=true;});
  try{var t=localStorage.getItem('sis-diag-'+p.id);if(t){var d=JSON.parse(t);Object.keys(d).forEach(function(k){r[k]=d[k];delete sug[k];});}}catch(e){}
  return {resp:r,sug:sug};
}
function diagSalvar(p,id,v){
  var d={};try{var t=localStorage.getItem('sis-diag-'+p.id);if(t)d=JSON.parse(t);}catch(e){}
  if(v===null)delete d[id];else d[id]=v;
  try{localStorage.setItem('sis-diag-'+p.id,JSON.stringify(d));}catch(e){}
}
function diagCalc(resp){
  var blocos=[],pcts={},flags={};
  CHK.blocos.forEach(function(b){
    var itens=[];b.grupos.forEach(function(g){g.itens.forEach(function(i){itens.push(i);});});
    var resp_n=0,soma=0,marc=[],naoI=[],parc=[];
    itens.forEach(function(i){
      var v=resp[i.id];
      if(b.tipo==='perfil'){if(v===1||v==='1')flags[i.id]=true;if(v===1||v===0)resp_n++;return;}
      if(v===undefined||v==='na')return;
      resp_n++;soma+=Number(v);

var CAIXA_PADRAO={meses:12,pmr:45,pmp:30,lp:40,lc:40,juros:12,caixaAplicado:0,ano:2033};
var CAIXA_CAMPOS=[
 {g:'Prazos (dias)',c:[['pmr','Prazo médio de recebimento das vendas'],['pmp','Prazo médio de pagamento aos fornecedores'],['lp','Dias entre a emissão da nota e o pagamento do imposto apurado'],['lc','Dias até o crédito da compra poder ser usado (extinção do tributo do fornecedor)']]},
 {g:'Período e custo',c:[['meses','Meses do período dos valores da carga efetiva'],['juros','Custo do dinheiro (% ao ano)'],['caixaAplicado','Caixa aplicado hoje (R$, só para comparação)']]}
];
function caixaPar(p){
  var P={},base=(p.caixa&&p.caixa.valores)?p.caixa.valores:CAIXA_PADRAO,sv={};
  try{var t=localStorage.getItem('sis-caixa-'+p.id);if(t)sv=JSON.parse(t);}catch(e){}
  Object.keys(CAIXA_PADRAO).forEach(function(k){var v=sv[k]!==undefined?sv[k]:(base[k]!==undefined?base[k]:CAIXA_PADRAO[k]);v=Number(v);P[k]=isFinite(v)?v:0;});
  return P;
}
function caixaCalc(C,K,ano){
  var b=cargaCalc(C,ano),m=K.meses>0?K.meses:1,D=b.debito/m,Cr=b.credito/m;
  var capC=Cr*Math.max(0,K.lc-K.pmp)/30;
  var calc=function(pmr){var v=D*Math.max(0,pmr-K.lp)/30;return {capV:v,capC:capC,cap:v+capC,custo:(v+capC)*K.juros/100};};
  var sem=calc(K.pmr);
  return {ano:ano,debitoMes:D,creditoMes:Cr,liquidoMes:D-Cr,sem:sem,com:{capV:0,capC:0,cap:0,custo:0},sens:[30,45,60,90,120].map(function(d){var r=calc(d);r.pmr=d;return r;}),aliq:b.aliqEf};
}
function caixaResHtml(C,K){
  var R=caixaCalc(C,K,K.ano),sem=R.sem;
  var ler=[];
  ler.push('No ano de '+K.ano+', a média mensal de IBS e CBS é de '+fmtR(R.debitoMes)+' de débito e '+fmtR(R.creditoMes)+' de crédito das compras, ou '+fmtR(R.liquidoMes)+' de imposto líquido por mês.');
  ler.push('Sem split payment, o imposto das vendas é pago '+K.lp+' dias após a emissão e o dinheiro entra em '+K.pmr+' dias: '+(K.pmr>K.lp?'a empresa financia '+(K.pmr-K.lp)+' dias de imposto sobre as vendas ('+fmtR(sem.capV)+').':'não há financiamento do imposto das vendas.')+' O crédito das compras só pode ser usado '+K.lc+' dias após a compra, e o fornecedor é pago em '+K.pmp+' dias: '+(K.lc>K.pmp?'a defasagem do crédito é de '+(K.lc-K.pmp)+' dias ('+fmtR(sem.capC)+').':'não há defasagem do crédito.'));
  ler.push('Capital de giro adicional estimado: '+fmtR(sem.cap)+', com custo de '+fmtR(sem.custo)+' ao ano a '+K.juros+'% ao ano'+(K.caixaAplicado>0?', o que equivale a '+(sem.cap/K.caixaAplicado*100).toFixed(1).replace('.',',')+'% do caixa aplicado hoje.':'.'));
  var linhas=[['Imposto das vendas pago antes do recebimento',function(x){return fmtR(x.capV);}],['Crédito das compras ainda não utilizável',function(x){return fmtR(x.capC);}],['Capital de giro adicional',function(x){return fmtR(x.cap);},'tot'],['Custo anual do financiamento',function(x){return fmtR(x.custo);}]];
  var tab='<table class="c-tab" style="min-width:520px;"><tr><th></th><th>Sem split payment</th><th>Com split payment (aproximação)</th></tr>'+linhas.map(function(l){return '<tr'+(l[2]?' class="'+l[2]+'"':'')+'><td>'+esc(l[0])+'</td><td>'+l[1](R.sem)+'</td><td>'+l[1](R.com)+'</td></tr>';}).join('')+'</table>';
  var sens='<table class="c-tab" style="min-width:560px;margin-top:14px;"><tr><th>Se o prazo de recebimento for de</th>'+R.sens.map(function(x){return '<th>'+x.pmr+' dias</th>';}).join('')+'</tr><tr><td>Capital de giro adicional, sem split</td>'+R.sens.map(function(x){return '<td>'+fmtR(x.cap)+'</td>';}).join('')+'</tr></table>';
  return '<div class="c-res"><h3>Resultado, no ano de '+K.ano+'</h3>'+tab+'<h3 style="margin-top:16px;">Sensibilidade ao prazo de recebimento</h3>'+sens+'<ul class="c-ler">'+ler.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul></div>';

/* ===== Calendário de refazimento de preço ===== */
function precoCalc(P,ano){
  var T=cargaTabelaAno(ano,P),c=cargaCalc(P,ano),b0=cargaCalc(P,2026);
  var tot=P.recServ+P.recBens||1,s=P.credClientes/100;
  var tS0=P.recServ*(P.rPCserv+P.rISS)/100,NS=P.recServ-tS0,embS=P.rISS/100*T.iss+(T.pc?P.rPCserv/100:0);
  var iS=P.recServ?NS/(1-embS)/P.recServ*100:100;
  var pcNet=P.rPCbens/100*(P.recBens-P.icmsBens-P.ipiBens-P.comprasBensCred);
  var tB0=P.icmsBens+P.ipiBens+Math.max(0,pcNet),NB=P.recBens-tB0;
  var embB=P.recBens?(P.icmsBens/P.recBens)*T.iss+(P.ipiBens/P.recBens)*T.ipi+(Math.max(0,pcNet)/P.recBens)*T.pc:0;
  var iB=P.recBens?NB/(1-embB)/P.recBens*100:100;
  var wS=P.recServ/tot,wB=P.recBens/tot;
  var credito=wS*iS+wB*iB,semCred=credito*(1+c.aliqEf);
  return {ano:ano,aliqEf:c.aliqEf,embS:embS,embB:embB,idxServ:iS,idxBens:iB,idxCred:credito,idxSemCred:semCred,idxMedio:s*credito+(1-s)*semCred,pressaoFolha:(c.pessoal-b0.pessoal)/tot*100};
}
function precoLinhas(P,limiar){
  var L=[2026,2027,2028,2029,2030,2031,2032,2033].map(function(a){return precoCalc(P,a);});
  L.forEach(function(x,i){var p=i?L[i-1]:null;x.dCred=p?x.idxCred-p.idxCred:0;x.dSem=p?x.idxSemCred-p.idxSemCred:0;x.rev=!!(p&&(Math.abs(x.dCred)>=limiar||Math.abs(x.dSem)>=limiar));});
  return L;
}
function precoPar(p){var sv={};try{var t=localStorage.getItem('sis-preco-'+p.id);if(t)sv=JSON.parse(t);}catch(e){}var v=Number(sv.limiar);return {limiar:isFinite(v)&&sv.limiar!==undefined?v:1};}
function precoResHtml(P,K){
  var L=precoLinhas(P,K.limiar),f1=function(v){return v.toFixed(1).replace('.',',');},pp=function(v){return (v>=0?'+':'−')+Math.abs(v).toFixed(1).replace('.',',');};
  var cols=[['Alíquota efetiva de IBS e CBS (%)',function(x){return (x.aliqEf*100).toFixed(2).replace('.',',')+'%';}],
   ['Preço sem IBS e CBS: serviços (hoje = 100)',function(x){return f1(x.idxServ);}],['Preço sem IBS e CBS: bens (hoje = 100)',function(x){return f1(x.idxBens);}],
   ['Custo do cliente que toma crédito (hoje = 100)',function(x){return f1(x.idxCred);}],['Preço ao cliente que não toma crédito (hoje = 100)',function(x){return f1(x.idxSemCred);}],
   ['Preço médio conforme o % de clientes com crédito',function(x){return f1(x.idxMedio);}],
   ['Variação do preço ao cliente sem crédito no ano (pontos)',function(x,i){return i?pp(x.dSem):'—';}],
   ['Pressão de custo da folha, contra 2026 (% da receita)',function(x){return f1(x.pressaoFolha)+'%';}],
   ['Rever o preço neste ano?',function(x){return x.rev?'Sim':'—';},'rev']];
  var tab='<table class="c-tab" style="min-width:820px;"><tr><th>Índice de preço, que mantém a receita líquida de tributos de hoje</th>'+L.map(function(x){return '<th>'+x.ano+(x.ano===2026?' (hoje)':'')+'</th>';}).join('')+'</tr>'+
   cols.map(function(c){return '<tr><td>'+esc(c[0])+'</td>'+L.map(function(x,i){return '<td'+(c[2]&&x.rev?' class="rev-tag"':'')+'>'+c[1](x,i)+'</td>';}).join('')+'</tr>';}).join('')+'</table>';
  var rev=L.filter(function(x){return x.rev;}).map(function(x){return x.ano;}),mx=L.slice(1).reduce(function(a,x){return Math.abs(x.dSem)>Math.abs(a.dSem)?x:a;},L[1]),u=L[7];
  var ler=[];
  ler.push('Com o limiar de '+String(K.limiar).replace('.',',')+' ponto(s), o preço pede revisão em: '+(rev.length?rev.join(', '):'nenhum ano')+'. O maior passo é em '+mx.ano+' ('+pp(mx.dSem)+' ponto(s) para o cliente que não toma crédito).');
  ler.push('No novo modelo pleno (2033), o preço sem IBS e CBS, para manter a receita líquida de tributos de hoje, equivale a '+f1(u.idxCred)+' do atual. O cliente que toma crédito paga esse valor líquido, e o que não toma crédito paga '+f1(u.idxSemCred)+', com o imposto por fora.');
  ler.push('Em 2028, a reoneração da folha e a extinção da CPRB pressionam o custo em '+f1(L[2].pressaoFolha)+'% da receita contra 2026 (Lei 14.973/2024). Repassar ou não é decisão comercial, e não faz parte do índice de preço acima.');
  return '<div class="c-res"><h3>Calendário de preço, 2026 a 2033</h3>'+tab+'<ul class="c-ler">'+ler.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul></div>';
}
