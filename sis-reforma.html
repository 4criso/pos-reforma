  '<a class="card" href="#diagnostico"><div class="icon"><span class="material-symbols-outlined">fact_check</span></div><span class="status live">Disponível</span><h3>Diagnóstico por checklist</h3><p>Sete blocos para medir a exposição da empresa à reforma (perfil, créditos, benefícios, documentos, preço e caixa, planejamento e maturidade), com classificação sugerida e relatório de cenário.</p></a>'+
  '<a class="card" href="#carga"><div class="icon"><span class="material-symbols-outlined">calculate</span></div><span class="status live">Disponível</span><h3>Carga efetiva</h3><p>Simulador parametrizável de IBS e CBS de 2026 a 2033: débito, crédito das compras, saldo credor, exportação imune e reoneração da folha, com valores iniciais do perfil.</p></a>'+
  '<a class="card" href="#caixa"><div class="icon"><span class="material-symbols-outlined">payments</span></div><span class="status live">Disponível</span><h3>Fluxo de caixa</h3><p>Competência contra caixa: capital de giro que o imposto passa a exigir, com e sem split payment, e sensibilidade ao prazo de recebimento.</p></a>'+
  '<a class="card" href="#preco"><div class="icon"><span class="material-symbols-outlined">timeline</span></div><span class="status live">Disponível</span><h3>Calendário de preço</h3><p>Quando refazer o preço de 2026 a 2033: o índice que mantém a receita líquida de tributos, para o cliente que toma crédito e para o que não toma, e a pressão de custo da folha.</p></a>'+
  '</div><div class="section-title">Como o portal vai crescer</div><div class="roadmap"><h3>Próximos módulos, na ordem que faz mais sentido construir</h3><ol>'+
  (p.textos.roadmap||[]).map(function(r){return '<li>'+esc(r[0])+' <span>'+esc(r[1])+'</span></li>';}).join('')+'</ol></div></main>'+
  '<footer>Portal interno de apoio — não substitui orientação da consultoria tributária terceirizada nem a leitura da LC 214/2025 e normas complementares.</footer></div>';
}
function planoHtml(p){
  var r=planoResumo(p.frentes);
  return '<div data-v="plano">'+
  '<header><div class="brand">'+brand(p,36)+'</div><h1>Plano de Ação — Reforma Tributária</h1><p>'+esc(p.textos.planoIntro)+'</p></header>'+
  '<main><div class="progress-wrap"><h2>Progresso geral</h2><div class="sub">'+esc(r.texto)+'</div><div class="bar"><div class="bar-fill" style="width:'+r.pct+'%;"></div></div>'+
  '<div class="progress-legend"><span><span class="dot done"></span>Concluído</span><span><span class="dot wip"></span>Em andamento</span><span><span class="dot todo"></span>Não iniciado</span></div></div>'+
  '<div class="section-title">Perfil da empresa</div><div class="profile-table"><table>'+
  p.empresa.map(function(e){return '<tr><td class="item">'+esc(e.item)+'</td><td>'+esc(e.valor)+'</td><td><span class="status-pill '+esc(e.status)+'">'+(e.status==='confirmado'?'Confirmado':'Pendente')+'</span></td></tr>';}).join('')+
  '<tr><td class="item">Setor (modelo)</td><td>'+esc(setorDe(p)?setorDe(p).nome:'—')+'</td><td><span class="status-pill pendente">Pendente</span></td></tr>'+
  '</table></div>'+setorBox(p)+'<div class="section-title">Frentes de trabalho</div><div id="frentes">'+frentesHtml(p.frentes,planoOpen)+'</div></main>'+
  '<footer><div>O lembrete de verificação mensal da tabela de CST/cClassTrib está na página inicial do <a href="#portal">Portal</a>.</div></footer></div>';
}
function cstHtml(p){
  var rows=cstRows(p),groups=[];
  rows.forEach(function(r){if(!groups.filter(function(g){return g[0]===r[0];}).length)groups.push([r[0],r[1]]);});
  var rel=(p.cstRelevantes||[]).length>0;
  var res=cstResultsHtml(rows,cstUI,cstOpen);
  return '<div data-v="cst">'+
  '<header><div class="brand">'+brand(p,34)+'</div><h1>Consulta de Classificação Tributária (CST / cClassTrib)</h1><p>'+esc(CST.intro)+'</p><div class="src-badge">'+esc(fmt(CST.meta.badge))+((CST.meta.links||[]).map(function(l){return ' · <a href="'+esc(l.href)+'" target="_blank" rel="noopener">'+esc(l.texto)+' ↗</a>';}).join(''))+'</div>'+'</header>'+
  '<div class="controls"><input type="text" id="search" placeholder="Buscar por código ou palavra-chave..." value="'+esc(cstUI.q)+'">'+
  '<select id="cstFilter"><option value="">Todos os CST</option>'+groups.map(function(g){return '<option value="'+esc(g[0])+'"'+(cstUI.cst===g[0]?' selected':'')+'>'+esc(g[0])+' — '+esc(g[1])+'</option>';}).join('')+'</select>'+
  '<label class="chk"'+(rel?'':' title="Este perfil não tem códigos marcados como relevantes"')+'><input type="checkbox" id="onlyRelevant"'+(cstUI.onlyRel&&rel?' checked':'')+(rel?'':' disabled')+'> Só relevantes p/ '+esc(p.nome)+'</label>'+
  '<label class="chk"><input type="checkbox" id="hideEncerrados"'+(cstUI.hideEnc?' checked':'')+'> Ocultar encerrados</label></div>'+
  '<main><div class="legend">'+fmt(CST.meta.legenda)+'</div><div class="count" id="count">'+esc(res.count)+'</div><div id="results">'+res.html+'</div></main>'+
  '<footer><div><strong>Fonte oficial:</strong>'+esc(fmt(CST.meta.fonte))+'</div><div class="disclaimer"><strong>Tabela viva:</strong>'+esc(CST.meta.aviso)+'</div></footer></div>';
}

/* ===== Montagem e eventos ===== */
var ROTAS={portal:portalHtml,plano:planoHtml,cst:cstHtml,setor:setorHtml,diagnostico:diagHtml,carga:cargaHtml,caixa:caixaHtml,preco:precoHtml};
function rotaAtual(){var r=((location.hash||'#portal').slice(1)).split('/')[0];return ROTAS[r]?r:'portal';}
function bindPlano(view){
  var fr=view.querySelector('#frentes');if(!fr)return;
  fr.addEventListener('click',function(e){
    var h=e.target.closest?e.target.closest('.acc-header[data-n]'):null;if(!h)return;
    var n=h.getAttribute('data-n');planoOpen[n]=!planoOpen[n];fr.innerHTML=frentesHtml(perfil.frentes,planoOpen);
  });
}
function bindCst(view){
  var search=view.querySelector('#search'),sel=view.querySelector('#cstFilter'),rel=view.querySelector('#onlyRelevant'),hide=view.querySelector('#hideEncerrados');
  var results=view.querySelector('#results'),count=view.querySelector('#count');
  if(!search||!results)return;
  function render(){
    var rows=cstRows(perfil);var r=cstResultsHtml(rows,cstUI,cstOpen);
    count.textContent=r.count;results.innerHTML=r.html;   /* só atualiza #count e #results: os campos de busca não são recriados */
  }
  search.addEventListener('input',function(){cstUI.q=search.value;render();});
  sel.addEventListener('change',function(){cstUI.cst=sel.value;render();});
  rel.addEventListener('change',function(){cstUI.onlyRel=rel.checked;render();});
  hide.addEventListener('change',function(){cstUI.hideEnc=hide.checked;render();});
  results.addEventListener('click',function(e){
    var h=e.target.closest?e.target.closest('.acc-header[data-cst]'):null;if(!h)return;
    var c=h.getAttribute('data-cst');cstOpen[c]=!cstOpen[c];render();
  });
}
function bindDiag(view){
  var box=view.querySelector('#diagBox'),res=view.querySelector('#diagResumo');if(!box)return;
  box.addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('.opt'):null;if(!b)return;
    var it=b.closest('.diag-item'),id=it.getAttribute('data-id'),v=b.getAttribute('data-v'),ja=b.classList.contains('on');
    Array.prototype.forEach.call(it.querySelectorAll('.opt'),function(x){x.classList.remove('on');x.classList.remove('neg');});
    var sg=it.querySelector('.sug');if(sg)sg.remove();
    if(ja){diagSalvar(perfil,id,null);}else{diagSalvar(perfil,id,v==='na'?'na':Number(v));b.classList.add('on');if(b.getAttribute('data-neg')==='1')b.classList.add('neg');}
    res.innerHTML=diagResumoHtml(diagCalc(diagResp(perfil).resp));
  });
  var bx=view.querySelector('#diagBaixar'),ab=view.querySelector('#diagAbrir'),lp=view.querySelector('#diagLimpar');
  if(bx)bx.addEventListener('click',function(){baixarRelatorio(perfil,false);});
  if(ab)ab.addEventListener('click',function(){baixarRelatorio(perfil,true);});
  if(lp)lp.addEventListener('click',function(){if(window.confirm('Limpar as respostas do perfil '+perfil.nome+'?')){try{localStorage.removeItem('sis-diag-'+perfil.id);}catch(e){}mount();}});
}
function bindSetor(view){
  var sel=view.querySelector('#setorSel');if(!sel)return;
  sel.addEventListener('change',function(){try{localStorage.setItem('sis-setor-'+perfil.id,sel.value);}catch(e){}mount();});
}

/* ===== Integração com o PÓS e identificação do perfil ===== */
function chrome(){
  var av=$('avisoTopo');if(av)av.innerHTML=perfil.aviso?'<div class="aviso-topo">'+esc(perfil.aviso)+'</div>':'';
  if(perfil.tituloPagina)document.title=perfil.tituloPagina;
  var np=$('navPos'),pb=(SETORES.meta&&SETORES.meta.posBase)||'';
  if(np&&pb){np.href=pb;np.style.display='';}
}
function estudoHtml(rota){
  var pb=(SETORES.meta&&SETORES.meta.posBase)||'',est=(SETORES.meta&&SETORES.meta.estudo&&SETORES.meta.estudo[rota])||[];
  if(!pb||!est.length)return '';
  return '<div class="estudo-box"><b>Para estudar no PÓS</b>'+est.map(function(e){return '<a href="'+esc(pb)+'#'+esc(e.aula)+'" target="_blank" rel="noopener">'+esc(e.titulo)+' ↗</a>';}).join('')+'</div>';
}
function mount(){
  var rota=rotaAtual(),view=$('view');
  view.innerHTML=ROTAS[rota](perfil)+estudoHtml(rota);chrome();
  Array.prototype.forEach.call(document.querySelectorAll('#topnav a[data-r]'),function(a){a.classList.toggle('active',a.getAttribute('data-r')===rota);});
  if(rota==='plano')bindPlano(view);
  if(rota==='cst')bindCst(view);
  if(rota==='setor')bindSetor(view);
  if(rota==='diagnostico')bindDiag(view);
  if(rota==='carga')bindCarga(view);
  if(rota==='caixa')bindCaixa(view);
  if(rota==='preco')bindPreco(view);
}
function preencherPerfis(){
  var sel=$('perfilSel');if(!sel)return;
  if(PERFIS.length<2&&sel.parentNode)sel.parentNode.style.display='none';
  sel.innerHTML=PERFIS.map(function(p){return '<option value="'+esc(p.id)+'"'+(p.id===perfil.id?' selected':'')+'>'+esc(p.nome)+(p.privado?' (privado)':'')+'</option>';}).join('');
  sel.addEventListener('change',function(){
    var p=PERFIS.filter(function(x){return x.id===sel.value;})[0];if(!p)return;
    perfil=p;try{localStorage.setItem(STORE,p.id);}catch(e){}
    if(!(perfil.cstRelevantes||[]).length)cstUI.onlyRel=false;
    mount();
  });
}
function init(){
  if(!$('view'))return;
  preencherPerfis();
  window.addEventListener('hashchange',function(){mount();window.scrollTo(0,0);});
  mount();
}
window.__SIS__={cstRows:cstRows,cstFilter:cstFilter,cstResultsHtml:cstResultsHtml,planoResumo:planoResumo,frentesHtml:frentesHtml,portalHtml:portalHtml,planoHtml:planoHtml,cstHtml:cstHtml,setorHtml:setorHtml,setorDe:setorDe,estudoHtml:estudoHtml,SETORES:SETORES,diagHtml:diagHtml,cargaHtml:cargaHtml,cargaCalc:cargaCalc,cargaPar:cargaPar,caixaHtml:caixaHtml,caixaCalc:caixaCalc,caixaPar:caixaPar,precoHtml:precoHtml,precoCalc:precoCalc,precoLinhas:precoLinhas,diagCalc:diagCalc,relatorioHtml:relatorioHtml,CHK:CHK,diagResp:diagResp,perfis:PERFIS,CST:CST};
init();
})();

</script>
</body>
</html>
